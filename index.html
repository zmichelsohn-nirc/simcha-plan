<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simcha Planning</title>
  <meta name="description" content="A community directory of musicians, photographers, caterers, venues and more for planning a simcha.">
  <meta property="og:title" content="Simcha Planning">
  <meta property="og:description" content="A community directory of musicians, photographers, caterers, venues and more for planning a simcha.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">Mazel Tov!</p>
    <h1>Simcha Planning</h1>
    <p class="tagline">Musicians, photographers, caterers, venues and more, all in one place.</p>
  </header>

  <div class="update-banner">
    <span>Know a vendor we're missing, or see something out of date?</span>
    <a class="update-button" href="https://docs.google.com/spreadsheets/d/1HEefTFbxDTZSZ6nWfjJUHf4g8pLoOasV86y-jTOIpts/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Add or update a listing</a>
  </div>

  <main id="app">
    <div id="controls" class="controls hidden">
      <input id="search" class="search" type="search" placeholder="Search by name, notes, phone..." aria-label="Search listings">
      <nav id="chips" class="chips" aria-label="Categories"></nav>
    </div>
    <div id="loading" class="status-message">Loading vendors...</div>
    <div id="error" class="status-message status-error hidden"></div>
    <section id="vendor-list" class="vendor-list hidden" aria-live="polite"></section>
    <p id="no-results" class="status-message hidden">No listings match your search.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
